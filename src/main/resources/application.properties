spring.application.name=student-management-api

# Local development ke liye application-local.properties (gitignored) automatically load hoti hai
spring.profiles.default=local

# Database config (environment variables se override ho sakta hai)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/student_management_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Pagination defaults
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50
